services:
  - type: web
    name: customizable-telegram-bot
    env: docker
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DATA_DIR
        value: /app/data
